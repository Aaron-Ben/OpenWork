[workspace]
members = [
  "crates/openwork-collab",
  "crates/openwork-sandbox",
  "desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
openwork-sandbox = { path = "crates/openwork-sandbox" }
openwork-collab = { path = "crates/openwork-collab" }
async-trait = "0.1"
base64 = "0.22"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "derive", "time", "migrate", "macros"] }
thiserror = "2"
tracing = "0.1"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
hmac = "0.12"
libc = "0.2"
redis = { version = "1", features = ["tokio-comp"] }
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["rt"] }

# 抑制 lint 用 #[expect(lint, reason = "...")]：lint 不再触发时会报错，不会留下过时的抑制。
[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
