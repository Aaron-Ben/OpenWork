[workspace]
members = [
  "crates/openwork-agent",
  "crates/openwork-chat-state",
  "crates/openwork-collab",
  "crates/openwork-models",
  "crates/openwork-tools",
  "crates/openwork-core",
  "desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
openwork-agent = { path = "crates/openwork-agent" }
openwork-chat-state = { path = "crates/openwork-chat-state" }
openwork-models = { path = "crates/openwork-models" }
openwork-tools = { path = "crates/openwork-tools" }
openwork-core = { path = "crates/openwork-core" }
async-trait = "0.1"
aes-gcm = { version = "0.11", features = ["zeroize"] }
base64 = "0.22"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.0.1", default-features = false, features = ["deserialize"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "derive", "time", "migrate", "macros"] }
thiserror = "2"
tracing = "0.1"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.9", features = ["derive"] }
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1"
schemars = "1"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["rt"] }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
