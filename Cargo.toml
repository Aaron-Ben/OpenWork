[workspace]
members = [
  "crates/anvil-core",
  "crates/anvil-runtime",
  "crates/anvil-tools",
  "crates/anvil-providers",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anvil-core = { path = "crates/anvil-core" }
anvil-runtime = { path = "crates/anvil-runtime" }
anvil-tools = { path = "crates/anvil-tools" }
anvil-providers = { path = "crates/anvil-providers" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
futures-util = "0.3"
