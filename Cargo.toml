[workspace]
members = [
  "crates/openwork-protocol",
  "crates/openwork-database",
  "crates/openwork-db-macros",
  "crates/openwork-core",
  "crates/openwork-app",
  "crates/openwork-capabilities",
  "crates/openwork-execution",
  "crates/openwork-providers",
  "crates/openwork-persistence",
  "crates/openwork-session",
  "crates/openwork-workspace",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
openwork-protocol = { path = "crates/openwork-protocol" }
openwork-database = { path = "crates/openwork-database" }
openwork-db-macros = { path = "crates/openwork-db-macros" }
openwork-core = { path = "crates/openwork-core" }
openwork-app = { path = "crates/openwork-app" }
openwork-capabilities = { path = "crates/openwork-capabilities" }
openwork-execution = { path = "crates/openwork-execution" }
openwork-providers = { path = "crates/openwork-providers" }
openwork-persistence = { path = "crates/openwork-persistence" }
openwork-session = { path = "crates/openwork-session" }
openwork-workspace = { path = "crates/openwork-workspace" }
async-trait = "0.1"
aes-gcm = { version = "0.11", features = ["zeroize"] }
base64 = "0.22"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "derive", "time"] }
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.9", features = ["derive"] }
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
regex = "1"
tokio-util = { version = "0.7", features = ["rt"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
