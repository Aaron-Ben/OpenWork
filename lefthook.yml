# git hooks 只做快速检查，不修改文件或暂存区；完整检查用 pnpm check。
# 安装：pnpm install 时由根 package.json 的 prepare 脚本执行 lefthook install。

pre-commit:
  jobs:
    # 只检查，不自动修复：自动修复会改写暂存内容，与部分暂存的文件冲突。格式问题用 pnpm format 修复。
    - name: biome（暂存文件）
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

    - name: 空白字符（暂存内容）
      run: git diff --cached --check

    # 两者检查仓库里的全部文件，不只暂存的文件：改名代码文件会让没有改动的文档里的路径失效。合计不到 1 秒。
    - name: 文档检查
      run: pnpm exec tsx scripts/verify-docs.ts

    - name: 代码约定检查
      run: pnpm exec tsx scripts/verify-code.ts

commit-msg:
  jobs:
    - name: 提交说明格式
      run: pnpm exec tsx scripts/verify-commit-msg.ts {1}

pre-push:
  jobs:
    - name: 类型检查
      run: pnpm typecheck
