[package]
name = "openwork-collab"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
openwork-credentials.workspace = true
openwork-models.workspace = true
axum = "0.8"
dotenvy.workspace = true
reqwest.workspace = true
rmcp = { version = "=3.1.3", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
semver = "1"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "macros", "serde"] }
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "signal", "time"] }
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
