name: openwork

services:
  postgres:
    image: postgres:16-alpine
    container_name: openwork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openwork
      POSTGRES_PASSWORD: openwork
      POSTGRES_DB: openwork
    ports:
      - "5432:5432"
    volumes:
      - openwork-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwork -d openwork"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openwork-postgres-data:
