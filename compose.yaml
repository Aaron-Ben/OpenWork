name: crew

services:
  postgres:
    image: postgres:16-alpine
    container_name: crew-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crew
      POSTGRES_PASSWORD: crew
      POSTGRES_DB: crew
    ports:
      - "5432:5432"
    volumes:
      - crew-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crew -d crew"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 只有旧版 Rust 代码用 Redis，Crew 不用。启动它：docker compose --profile legacy up -d --wait
  redis:
    profiles: [legacy]
    image: redis:7-alpine
    container_name: crew-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crew-postgres-data:
